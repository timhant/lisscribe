name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 必须是 windows-latest。本项目全是 Windows-only 的 P/Invoke（低层键盘钩子、SendInput、
    # SetWindowLongPtr），ubuntu runner 上连带 Lisscribe.Platform 的解决方案都编译不过。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore lisscribe.sln

      - name: Build
        run: dotnet build lisscribe.sln --no-restore --configuration Release

      # 确定性测试：每次 PR 都跑，不依赖任何外部资源。
      #
      # **三个过滤器一个都不能少**，计划里那份只写了 RequiresModel，照抄会得到一个开局就红的 CI：
      #   RequiresModel   —— 要几百 MB 权重，下面单独一步跑。
      #   RequiresDesktop —— 18 个类会建真窗口、抢前台、往桌面发合成输入。runner 上前台被别人
      #                      占着时它们固定红，且互相之间也会抢（本机实测「整解决方案一起跑
      #                      偶发整批红，按项目分两次跑才稳」）。
      #   Benchmark       —— 性能取数，一次三分多钟，而 runner 的性能波动大到那组数没有意义。
      #
      # RequiresMediaFoundation **不排除**：音频解码器测试要系统的 Media Foundation 解码，还要现场
      # 用它编出 m4a / mp3。Windows Server 上它是可选功能，但 runner 镜像带着——2026-10-29 实测
      # `windows-2025-vs2026`（20261021.278.1）上这批测试全部真跑、全过，无一 Skip。哪天镜像不带了，
      # 这一步会红在解码器测试上，那时再加一步装 Server-Media-Foundation，别直接排除了事。
      - name: Test (deterministic)
        run: >
          dotnet test lisscribe.sln --no-build --configuration Release
          -- --filter-not-trait "Category=RequiresModel"
          --filter-not-trait "Category=RequiresDesktop"
          --filter-not-trait "Category=Benchmark"
          --report-trx --report-trx-filename deterministic.trx

      # 权重不入 Git（体积 + 许可）。缓存未命中时下载；下载失败也不让 CI 变红 ——
      # 相关测试会自行 Skip（Assert.SkipUnless(ModelFixture.IsAvailable, ...)）。
      - name: Cache SenseVoice model
        id: sense-voice-cache
        uses: actions/cache@v6
        with:
          path: models/sense-voice
          key: sense-voice-int8-2024-07-17-v1

      - name: Cache Qwen3-ASR model
        id: qwen3-cache
        uses: actions/cache@v6
        with:
          path: models/qwen3-asr
          key: qwen3-asr-0.6B-int8-2026-03-25-v1

      # 走我们自己的 Windows 脚本而不是那个 .sh：CI 因此顺带成了 fetch-models.ps1 的回归覆盖，
      # 而它正是干净机器上用户要跑的那一个。
      - name: Fetch SenseVoice model
        if: steps.sense-voice-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pwsh scripts/fetch-models.ps1 -Engine sense-voice

      - name: Fetch Qwen3-ASR model
        if: steps.qwen3-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pwsh scripts/fetch-models.ps1 -Engine qwen3

      # 模型测试与确定性那批分开跑。**这里也要排除 Benchmark** ——
      # 它同时带着 RequiresModel 这个 trait，只写 --filter-trait 会把它一起捞进来。
      #
      # --ignore-exit-code 8 是给「零测试」那个退出码开的：三个测试项目都有带模型 trait 的测试，
      # 但模型没下下来时它们全部 Skip，测试主机把这种「Zero tests ran」判成失败
      # （实测 Total: 0 却打 Failed!）。不忽略它，下载一失手这一步就红，红得毫无信息量，
      # 真出问题时反而没人分得出。**只忽略 8 这一个码**：真有测试失败走的是别的码，
      # 照样红——阳性对照验过（临时塞一条必败的测试，带着这个开关仍然 EXIT=1）。
      #
      # 文件转写那几条（Platform 与 App 两处）同时带 RequiresMediaFoundation：它们要系统的
      # Media Foundation 解码 m4a，与上面确定性那批里的解码器测试是同一个前提。
      - name: Test (model quality)
        continue-on-error: true
        run: >
          dotnet test lisscribe.sln --no-build --configuration Release
          -- --filter-trait "Category=RequiresModel"
          --filter-not-trait "Category=Benchmark"
          --ignore-exit-code 8
          --report-trx --report-trx-filename model.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
